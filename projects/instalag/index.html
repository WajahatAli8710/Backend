<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - alex.travels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== HEADER / NAVBAR ==================== -->
  <header class="header">
    <div class="header-inner">
      <a href="#" class="header-logo">
        <svg class="instagram-logo" viewBox="0 0 176 50" fill="currentColor" height="29">
          <path d="M0 0h24v24H0z" fill="none"/>
          <text x="0" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="400" fill="currentColor" letter-spacing="-1">Instagram</text>
        </svg>
      </a>

      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" placeholder="Search" class="search-input">
      </div>

      <nav class="header-nav">
        <a href="#" class="nav-icon" title="Home">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005z"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Explore">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Reels">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M2 8h20M8 2v6M16 2v6M9.5 12.5l5 3-5 3z"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Messages">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Notifications">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>
        <a href="#" class="nav-icon nav-icon--avatar" title="Profile">
          <img src="https://i.pravatar.cc/32?img=11" alt="Profile" class="nav-avatar">
        </a>
      </nav>

      <!-- Mobile nav -->
      <nav class="mobile-nav">
        <a href="#" class="nav-icon" title="Home">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005z"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Explore">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Reels">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M2 8h20M8 2v6M16 2v6M9.5 12.5l5 3-5 3z"/></svg>
        </a>
        <a href="#" class="nav-icon" title="Messages">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
        </a>
        <a href="#" class="nav-icon nav-icon--avatar" title="Profile">
          <img src="https://i.pravatar.cc/32?img=11" alt="Profile" class="nav-avatar">
        </a>
      </nav>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="main">
    <div class="container">

      <!-- ==================== PROFILE SECTION ==================== -->
      <section class="profile">
        <div class="profile-picture">
          <div class="profile-picture-ring">
            <img src="https://i.pravatar.cc/150?img=11" alt="alex.travels" class="profile-img">
          </div>
        </div>

        <div class="profile-info">
          <!-- Username row -->
          <div class="profile-username-row">
            <h1 class="profile-username">alex.travels</h1>
            <div class="profile-actions">
              <button class="btn btn-edit" id="editProfileBtn">Edit profile</button>
              <button class="btn btn-secondary">View archive</button>
              <button class="btn-icon" title="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Stats row (desktop) -->
          <div class="profile-stats profile-stats--desktop">
            <div class="stat">
              <span class="stat-count" id="postsCount">0</span> posts
            </div>
            <div class="stat">
              <span class="stat-count" id="followersCount">0</span> followers
            </div>
            <div class="stat">
              <span class="stat-count" id="followingCount">0</span> following
            </div>
          </div>

          <!-- Bio -->
          <div class="profile-bio">
            <span class="bio-name">Alex Morgan</span>
            <span class="bio-category">Travel & Adventure</span>
            <p class="bio-text">Exploring the world one city at a time<br>Photographer | Storyteller | Coffee addict<br>Based in San Francisco</p>
            <a href="#" class="bio-link">linktr.ee/alex.travels</a>
          </div>
        </div>
      </section>

      <!-- Stats row (mobile) -->
      <div class="profile-stats profile-stats--mobile">
        <div class="stat">
          <span class="stat-count" id="postsCountMobile">0</span>
          <span class="stat-label">posts</span>
        </div>
        <div class="stat">
          <span class="stat-count" id="followersCountMobile">0</span>
          <span class="stat-label">followers</span>
        </div>
        <div class="stat">
          <span class="stat-count" id="followingCountMobile">0</span>
          <span class="stat-label">following</span>
        </div>
      </div>

      <!-- ==================== HIGHLIGHTS SECTION ==================== -->
      <section class="highlights" id="highlights">
        <!-- Populated by JS -->
      </section>

      <!-- ==================== TABS SECTION ==================== -->
      <section class="tabs">
        <button class="tab active" data-tab="posts">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="1" y="1" width="9" height="9"/><rect x="14" y="1" width="9" height="9"/><rect x="1" y="14" width="9" height="9"/><rect x="14" y="14" width="9" height="9"/></svg>
          <span class="tab-label">POSTS</span>
        </button>
        <button class="tab" data-tab="reels">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M2 8h20M8 2v6M16 2v6M9.5 12.5l5 3-5 3z"/></svg>
          <span class="tab-label">REELS</span>
        </button>
        <button class="tab" data-tab="saved">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="tab-label">SAVED</span>
        </button>
      </section>

      <!-- ==================== POSTS GRID ==================== -->
      <section class="posts-grid" id="postsGrid">
        <!-- Populated by JS -->
      </section>

      <!-- Reels (hidden by default) -->
      <section class="posts-grid reels-grid hidden" id="reelsGrid">
        <!-- Populated by JS -->
      </section>

      <!-- Saved (hidden by default) -->
      <section class="saved-section hidden" id="savedGrid">
        <div class="saved-subtabs">
          <button class="saved-subtab active" data-saved-tab="saved-posts">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="1" y="1" width="9" height="9"/><rect x="14" y="1" width="9" height="9"/><rect x="1" y="14" width="9" height="9"/><rect x="14" y="14" width="9" height="9"/></svg>
            Posts
          </button>
          <button class="saved-subtab" data-saved-tab="saved-reels">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M2 8h20M8 2v6M16 2v6M9.5 12.5l5 3-5 3z"/></svg>
            Reels
          </button>
        </div>
        <div class="posts-grid" id="savedPostsGrid">
          <!-- Populated by JS -->
        </div>
        <div class="posts-grid reels-grid hidden" id="savedReelsGrid">
          <!-- Populated by JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- ==================== EDIT PROFILE MODAL ==================== -->
  <div class="modal-overlay hidden" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Edit profile</h2>
        <button class="modal-close" id="closeModal">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Name</label>
          <input type="text" value="Alex Morgan">
        </div>
        <div class="modal-field">
          <label>Username</label>
          <input type="text" value="alex.travels">
        </div>
        <div class="modal-field">
          <label>Bio</label>
          <textarea rows="3">Exploring the world one city at a time
Photographer | Storyteller | Coffee addict
Based in San Francisco</textarea>
        </div>
        <div class="modal-field">
          <label>Website</label>
          <input type="text" value="linktr.ee/alex.travels">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveProfile">Submit</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
